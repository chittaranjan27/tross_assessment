services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LINKEDIN_SESSION_COOKIE=${LINKEDIN_SESSION_COOKIE:-""}
      - LINKEDIN_CSRF_TOKEN=${LINKEDIN_CSRF_TOKEN:-""}
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
